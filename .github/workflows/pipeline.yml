# Reemplaza a la tarea de Windows Task Scheduler (backend/run_pipeline_task.ps1):
# corre el pipeline completo (fixtures, cuotas, predicciones, value bets)
# contra la base de Neon una vez por hora.
#
# Secrets requeridos (GitHub -> Settings -> Secrets and variables -> Actions):
#   DATABASE_URL, API_FOOTBALL_KEY
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (opcionales: avisos al celular)
# Variable requerida (misma pantalla, pestaña "Variables"):
#   PIPELINE_ENABLED = true   -> activarla recién al apagar la tarea de Windows,
#                                para no correr el pipeline dos veces.
name: Pipeline horario

on:
  schedule:
    # Respaldo cada 6 h: el disparador principal es cron-job.org -> /api/cron/pipeline/
    # (los horarios de GitHub Actions se saltan seguido en repos con poca actividad).
    - cron: "17 */6 * * *"
  workflow_dispatch: {}    # permite correrlo a mano desde la pestaña Actions

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    if: vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: pipeline-only-not-serving-http
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py run_pipeline_once

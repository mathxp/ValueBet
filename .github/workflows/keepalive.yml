# Render (plan gratis) duerme la API tras 15 min sin tráfico y tarda ~30-50 s
# en despertar. Este ping cada 10 min la mantiene despierta (un solo servicio
# 24/7 entra en las 750 h gratis mensuales de Render). El repo es público, así
# que los minutos de GitHub Actions no tienen costo.
# Nota: GitHub pausa los workflows programados si el repo pasa 60 días sin commits.
name: Mantener API despierta

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://valuebet-api-gn1r.onrender.com/healthz
